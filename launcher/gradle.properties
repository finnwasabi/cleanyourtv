org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Rewrite baseline-prof.txt through R8 and lay the DEX out in its startup order (AGP 8.2+): the classes Home
# needs first sit together, so a cold start reads fewer pages.
android.experimental.art-profile-r8-rewriting=true
android.experimental.r8.dex-startup-optimization=true
